spring:
  application:
    name: pedidos-b2b
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

app:
  notifications:
    broker: ${NOTIFICATIONS_BROKER:rabbitmq}
    exchange: orders.events
    queue: orders.notifications
    confirm-timeout: 5s
    demo-consumer:
      enabled: false
  outbox:
    relay:
      enabled: true
      interval-ms: 500
      batch-size: 100
      max-attempts: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
